name: Deploy to GitHub Pages

# One workflow, committed identically to both repos. It branches on
# github.repository so the same file behaves correctly in each:
#
#   anroleroux/anroleroux.github.io  (PRODUCTION)
#     - main            → build `make prd`, deploy to anroleroux.co.za
#     - other branches  → build-check only, never deploys
#
#   anroleroux/staging.anroleroux    (STAGING)
#     - any branch      → build `make stg`, deploy to staging.anroleroux.co.za
#     - main            → deploy to staging AND promote: push HEAD to the
#                         production repo's main, which triggers the production
#                         deploy above
#
# A feature branch deploys to staging so you can look at it. Merging it to main
# deploys that merge to staging and then promotes it to production — the trunk
# IS production, so a merge to main ships within a minute. The promotion is
# gated on the staging deploy (`needs:`), so a merge that fails to build never
# reaches production.
#
# Keeping the file identical in both repos matters: promotion pushes staging's
# main into prod's main, which carries this workflow file with it. If the two
# ever diverged, a promotion would overwrite prod's workflow.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRODUCTION repo, main → build prod version and deploy to the live site.
  deploy-prod:
    if: github.repository == 'anroleroux/anroleroux.github.io' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the sitemap can read per-file commit dates

      - name: Build prod version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: make prd

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/dist

      - uses: actions/deploy-pages@v5
        id: deployment

  # PRODUCTION repo, non-main branch → validate the build only, never deploys.
  build-check:
    if: github.repository == 'anroleroux/anroleroux.github.io' && github.ref != 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the sitemap can read per-file commit dates

      - name: Build prod version (no deploy)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: make prd

  # STAGING repo, every branch → build the staging version and deploy
  # it to staging.anroleroux.co.za. This is an ONLINE build against the same
  # Supabase project as production; its rows are tagged env=0 so the two are
  # distinguishable. Staging exists to exercise the real backend wiring before
  # promotion, which the offline `make dev` build cannot do.
  deploy-staging:
    if: github.repository == 'anroleroux/staging.anroleroux'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build staging version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: make stg

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/dist

      - uses: actions/deploy-pages@v5
        id: deployment

  # STAGING repo, `main` → promote to production by pushing to the prod repo's
  # main. The prod repo's own workflow (deploy-prod above) then builds and
  # deploys. Auth is a write-enabled deploy key registered on the prod repo,
  # with its private half stored as the PROD_DEPLOY_KEY secret in this repo.
  # The push is a plain fast-forward; it will be rejected (not forced) if the
  # histories have diverged, which is a deliberate safety signal.
  promote-prod:
    if: github.repository == 'anroleroux/staging.anroleroux' && github.ref == 'refs/heads/main'
    needs: deploy-staging     # a failed staging build never promotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to production repo
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_DEPLOY_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes"
          git remote add production git@github.com:anroleroux/anroleroux.github.io.git
          git push production HEAD:main
